<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=login.html#register">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Tech - Register</title>
    <link rel="canonical" href="login.html#register">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #090979, #00d4ff);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            animation: float 7s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 180px;
            height: 180px;
            left: 10%;
            top: 15%;
        }

        .circle:nth-child(2) {
            width: 280px;
            height: 280px;
            right: 8%;
            bottom: 10%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 100px;
            height: 100px;
            left: 70%;
            top: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-35px) scale(1.08);
            }
        }

        .card {
            position: relative;
            z-index: 2;
            width: 380px;
            padding: 45px 35px;
            text-align: center;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            animation: cardEnter 1s ease;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: white;
            color: #090979;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            animation: logoPulse 2s infinite;
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        h1 {
            margin-top: 20px;
            color: white;
            font-size: 30px;
            letter-spacing: 1px;
        }

        p {
            margin-top: 10px;
            color: rgba(255,255,255,0.85);
            font-size: 14px;
        }

        .loader {
            width: 45px;
            height: 45px;
            margin: 25px auto 15px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading {
            color: white;
            font-size: 13px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .manual {
            margin-top: 20px;
            font-size: 13px;
        }

        .manual a {
            color: white;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 1px solid white;
        }

        .manual a:hover {
            opacity: 0.7;
        }

        @media (max-width: 450px) {
            .card {
                width: 90%;
                padding: 35px 25px;
            }
        }
    </style>

    <script>
        window.location.replace('login.html#register');
    </script>
</head>

<body>

    <div class="background">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="card">
        <div class="logo">A</div>

        <h1>ABC Tech</h1>

        <p>Preparing your registration page...</p>

        <div class="loader"></div>

        <div class="loading">
            Redirecting to Register
        </div>

        <div class="manual">
            <a href="login.html#register">
                Open Registration Manually
            </a>
        </div>
    </div>

</body>
</html>
